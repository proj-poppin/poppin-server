name: Deploy Poppin Dev v2.

on:
  push:
    branches:
      - dev-deploy-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Firebase Key File
        run: |
          mkdir -p src/main/resources/firebase
          echo '${{ secrets.FIREBASE_KEY }}' > src/main/resources/firebase/firebase_key.json

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload to S3
        run: |
          aws s3 cp build/libs/*.jar s3://$AWS_S3_DEV_BUCKET_NAME/app.jar
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version --application-name $EB_APP_NAME --version-label v-${{ github.run_id }} --source-bundle S3Bucket=$S3_BUCKET_NAME,S3Key=app.jar
          aws elasticbeanstalk update-environment --environment-name $EB_ENV_NAME --version-label v-${{ github.run_id }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
